<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Stitchra Open Graph brand image</title>
  <desc id="desc">Dark Stitchra social preview with the Thread Needle S mark and AI Embroidery T-Shirt Platform text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020403"/>
      <stop offset="0.52" stop-color="#07140f"/>
      <stop offset="1" stop-color="#03120e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(265 315) rotate(45) scale(220 220)">
      <stop stop-color="#8cff1f" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#16e884" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#16e884" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="42" y1="30" x2="130" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6ff3f"/>
      <stop offset="0.48" stop-color="#8cff1f"/>
      <stop offset="1" stop-color="#16e884"/>
    </linearGradient>
    <linearGradient id="metal" x1="80" y1="12" x2="80" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf4"/>
      <stop offset="0.48" stop-color="#cfd5d0"/>
      <stop offset="1" stop-color="#737d78"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="265" cy="315" r="260" fill="url(#halo)"/>
  <path d="M0 496C190 438 356 449 540 492C756 542 933 510 1200 424V630H0Z" fill="#0d1d15" opacity="0.54"/>
  <g transform="translate(92 142) scale(2.18)">
