    <path d="M80 13V147" fill="none" stroke="url(#metal)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M80 13C91 22 93 35 85 47C78 43 76 29 80 13Z" fill="#f8fff6" stroke="#f8fff6" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M69 62C78 57 88 57 98 62" fill="none" stroke="#8cff1f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5"/>
    <path d="M60 112C75 104 95 104 112 112" fill="none" stroke="#8cff1f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5" opacity="0.82"/>
  </g>
  <text x="438" y="286" fill="#f7fff5" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="950" letter-spacing="-7">Stitchra</text>
  <path d="M445 318H770" fill="none" stroke="#8cff1f" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10"/>
