<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Stitchra Thread Needle S icon</title>
  <desc id="desc">A refined thread-shaped S with a vertical needle, prepared as the master Stitchra brand mark.</desc>
  <defs>
    <linearGradient id="stitchra-thread-green" x1="42" y1="30" x2="130" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6ff3f"/>
      <stop offset="0.48" stop-color="#8cff1f"/>
      <stop offset="1" stop-color="#16e884"/>
    </linearGradient>
    <linearGradient id="stitchra-needle-metal" x1="80" y1="12" x2="80" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf4"/>
      <stop offset="0.48" stop-color="#cfd5d0"/>
      <stop offset="1" stop-color="#737d78"/>
    </linearGradient>
    <filter id="stitchra-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect id="stitchra-field" x="18" y="18" width="124" height="124" rx="34" fill="#07100b" stroke="#8cff1f" stroke-opacity="0.34" stroke-width="2.5"/>
  <g id="stitchra-glow-ring" opacity="0.42">
    <rect x="24" y="24" width="112" height="112" rx="30" fill="none" stroke="#16e884" stroke-opacity="0.28" stroke-width="2"/>
  </g>
  <g id="stitchra-s-mark">
    <path d="M113 42H82C55 42 42 52 42 69C42 84 55 91 80 92H92C110 92 121 101 121 116C121 134 105 143 78 143H43" fill="none" stroke="#030604" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M111 45H81C59 45 49 54 49 68C49 80 60 86 81 87H93C115 87 128 99 128 116C128 137 110 148 78 148H45" fill="none" stroke="url(#stitchra-thread-green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#stitchra-soft-glow)"/>
  </g>
  <g id="stitchra-needle">
    <path d="M80 13V147" fill="none" stroke="url(#stitchra-needle-metal)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M80 13C91 22 93 35 85 47C78 43 76 29 80 13Z" fill="#f8fff6" stroke="#f8fff6" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <g id="stitchra-thread-dots" fill="none" stroke="#8cff1f" stroke-linecap="round">
    <path d="M69 62C78 57 88 57 98 62" stroke-width="3" stroke-dasharray="1 5"/>
    <path d="M60 112C75 104 95 104 112 112" stroke-width="3" stroke-dasharray="1 5" opacity="0.82"/>
  </g>
  <path id="stitchra-baseline" d="M41 78C54 69 68 66 82 68" fill="none" stroke="#8cff1f" stroke-width="2.5" stroke-linecap="round" opacity="0.46"/>
</svg>
