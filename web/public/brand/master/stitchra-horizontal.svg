<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-labelledby="title desc">
  <title id="title">Stitchra horizontal Thread Needle S logo</title>
  <desc id="desc">Horizontal Stitchra lockup with the refined Thread Needle S icon and wordmark.</desc>
  <defs>
    <linearGradient id="thread-green" x1="42" y1="30" x2="130" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6ff3f"/>
      <stop offset="0.48" stop-color="#8cff1f"/>
      <stop offset="1" stop-color="#16e884"/>
    </linearGradient>
    <linearGradient id="needle-metal" x1="80" y1="12" x2="80" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf4"/>
      <stop offset="0.48" stop-color="#cfd5d0"/>
      <stop offset="1" stop-color="#737d78"/>
    </linearGradient>
  </defs>
  <g id="stitchra-icon">
    <rect x="18" y="18" width="124" height="124" rx="34" fill="#07100b" stroke="#8cff1f" stroke-opacity="0.34" stroke-width="2.5"/>
    <g id="stitchra-s-mark">
      <path d="M113 42H82C55 42 42 52 42 69C42 84 55 91 80 92H92C110 92 121 101 121 116C121 134 105 143 78 143H43" fill="none" stroke="#030604" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M111 45H81C59 45 49 54 49 68C49 80 60 86 81 87H93C115 87 128 99 128 116C128 137 110 148 78 148H45" fill="none" stroke="url(#thread-green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="stitchra-needle">
      <path d="M80 13V147" fill="none" stroke="url(#needle-metal)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M80 13C91 22 93 35 85 47C78 43 76 29 80 13Z" fill="#f8fff6" stroke="#f8fff6" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
    <g id="stitchra-thread-dots" fill="none" stroke="#8cff1f" stroke-linecap="round">
      <path d="M69 62C78 57 88 57 98 62" stroke-width="3" stroke-dasharray="1 5"/>
      <path d="M60 112C75 104 95 104 112 112" stroke-width="3" stroke-dasharray="1 5" opacity="0.82"/>
    </g>
  </g>
  <g id="stitchra-wordmark" fill="#f7fff9">
    <text x="198" y="96" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="950" letter-spacing="-5">Stitchra</text>
    <path d="M203 115H421" fill="none" stroke="#8cff1f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
    <text x="201" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="850" letter-spacing="2.4" opacity="0.72">AI EMBROIDERY STUDIO</text>
  </g>
</svg>
