<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07140f" />
    <title>Stitchra is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Arial,
          Helvetica,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f6fff9;
        background:
          radial-gradient(circle at 18% 20%, rgba(0, 255, 136, 0.17), transparent 30%),
          radial-gradient(circle at 82% 8%, rgba(0, 200, 255, 0.15), transparent 32%),
          linear-gradient(160deg, #07140f 0%, #020506 58%, #061014 100%);
      }

      main {
        width: min(520px, 100%);
        padding: clamp(26px, 6vw, 44px);
        border: 1px solid rgba(185, 255, 204, 0.16);
        border-radius: 30px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03)),
          rgba(3, 8, 8, 0.82);
        box-shadow:
          0 36px 90px rgba(0, 0, 0, 0.44),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
        text-align: center;
      }

      .mark {
        width: 68px;
        height: 68px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(0, 255, 136, 0.34);
        border-radius: 22px;
        color: #b9ffcc;
        background: rgba(0, 255, 136, 0.08);
        box-shadow: 0 0 42px rgba(0, 255, 136, 0.18);
        font-size: 40px;
        font-weight: 900;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(32px, 7vw, 48px);
        line-height: 1;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0 auto 26px;
        max-width: 390px;
        color: rgba(246, 255, 249, 0.72);
        font-size: 16px;
        line-height: 1.65;
      }

      button {
        min-height: 52px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        color: #06100a;
        background: linear-gradient(135deg, #18ff9a, #00c8ff);
        box-shadow: 0 16px 44px rgba(0, 220, 190, 0.24);
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>Stitchra is offline</h1>
      <p>
        Reconnect to continue designing, uploading logos or requesting a quote.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
